# This GitHub action can publish assets for release when a tag is created.
# Currently its setup to run on any tag that matches the pattern "v*" (ie. v0.1.0).
#
# This uses an action (hashicorp/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step
# in `goreleaser` to indicate this is being used in a non-interactive mode.
#
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_nodejs:
        description: Publish the Node.js SDK
        type: boolean
        default: true
      publish_python:
        description: Publish the Python SDK
        type: boolean
        default: true
      publish_dotnet:
        description: Publish the .NET SDK
        type: boolean
        default: true
      publish_go:
        description: Publish the Go SDK
        type: boolean
        default: true
      publish_java:
        description: Publish the Java SDK
        type: boolean
        default: true
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
  PUBLISH_NPM: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_nodejs }}
  NPM_REGISTRY_URL: https://registry.npmjs.org
  # IF YOU NEED TO PUBLISH A NUGET PACKAGE THEN ENSURE AN NUGET_PUBLISH_KEY
  # SECRET IS SET AND PUBLISH_NUGET: TRUE. IF YOU WANT TO PUBLISH TO AN ALTERNATIVE
  # NPM REGISTRY THEN ENSURE THE NPM_REGISTRY_URL IS CHANGED
  NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_TOKEN }}
  NUGET_FEED_URL: https://api.nuget.org/v3/index.json
  PUBLISH_NUGET: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_dotnet }}
  # IF YOU NEED TO PUBLISH A PYPI PACKAGE THEN ENSURE AN PYPI_API_TOKEN
  # SECRET IS SET AND PUBLISH_PYPI: TRUE. IF YOU WANT TO PUBLISH TO AN ALTERNATIVE
  # PYPI REGISTRY THEN ENSURE THE PYPI_REPOSITORY_URL IS SET. IF YOU ARE USING AN API_TOKEN THEN
  # YOU DO NOT NEED TO CHANGE THE PYPI_USERNAME (__token__) , IF YOU ARE USING PASSWORD AUTHENTICATION THEN YOU WILL
  # NEED TO CHANGE TO USE THE CORRECT PASSWORD
  PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  PYPI_USERNAME: "__token__"
  PYPI_REPOSITORY_URL: ""
  PUBLISH_PYPI: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_python }}

  PUBLISH_GO: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_go }}
  PUBLISH_JAVA: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_java }}
  SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  SIGNING_PASSWORD: ${{ secrets.PASSPHRASE }}
  PUBLISH_REPO_USERNAME: ${{secrets.PUBLISH_REPO_USERNAME}}
  PUBLISH_REPO_PASSWORD: ${{secrets.PUBLISH_REPO_PASSWORD}}

permissions:
  contents: write
jobs:
  build_sdk:
    name: Build SDKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        uses: pulumi/provider-version-action@v1
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v1.5.0
        with:
          repo: pulumi/pulumictl
          tag: v0.0.32
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeversion }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
      - name: Setup Yarn
        if: ${{ matrix.language == 'nodejs' }}
        run: npm install -g yarn@1.22.22
      - name: Setup DotNet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnetversion }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pythonversion }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        if: ${{ matrix.language == 'java' }}
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-${{ matrix.gradleversion }}-bin.zip" -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${{ matrix.gradleversion }}/bin" >> "$GITHUB_PATH"
      - name: Build SDK
        run: make build_${{ matrix.language }}
      - name: Check worktree clean
        run: |
          git update-index -q --refresh
          if ! git diff-files --quiet -- . ':(exclude)sdk/dotnet/logo.png'; then
              >&2 echo "error: working tree is not clean, aborting!"
              git status -- . ':(exclude)sdk/dotnet/logo.png'
              git diff -- . ':(exclude)sdk/dotnet/logo.png'
              exit 1
          fi
    strategy:
      fail-fast: true
      matrix:
        dotnetversion:
          - 6.0.408
        language:
          - nodejs
          - python
          - dotnet
          - go
          - java
        nodeversion:
          - 23.x
        pythonversion:
          - "3.9"
        gradleversion:
          - "7.4.1"
  publish_binary:
    runs-on: ubuntu-latest
    needs: build_sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v1.5.0
        with:
          repo: pulumi/pulumictl
          tag: v0.0.32
      - name: Check GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import GPG key
        if: ${{ steps.github_release.outputs.exists != 'true' }}
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        if: ${{ steps.github_release.outputs.exists != 'true' }}
        uses: goreleaser/goreleaser-action@v3.0.0
        with:
          version: v1.26.2
          args: release --rm-dist
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GitHub sets this automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish_sdk:
    name: Publish SDKs
    runs-on: ubuntu-latest
    needs: publish_binary
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        uses: pulumi/provider-version-action@v1
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v1.5.0
        with:
          repo: pulumi/pulumictl
          tag: v0.0.32
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeversion }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
      - name: Setup Yarn
        if: ${{ matrix.language == 'nodejs' }}
        run: npm install -g yarn@1.22.22
      - name: Setup DotNet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnetversion }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pythonversion }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        if: ${{ matrix.language == 'java' }}
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-${{ matrix.gradleversion }}-bin.zip" -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${{ matrix.gradleversion }}/bin" >> "$GITHUB_PATH"
      - name: Build SDK
        run: make build_${{ matrix.language }}
      - name: Check worktree clean
        run: |
          git update-index -q --refresh
          if ! git diff-files --quiet -- . ':(exclude)sdk/dotnet/logo.png'; then
              >&2 echo "error: working tree is not clean, aborting!"
              git status -- . ':(exclude)sdk/dotnet/logo.png'
              git diff -- . ':(exclude)sdk/dotnet/logo.png'
              exit 1
          fi
      - name: Check PyPI package
        id: pypi_package
        if: ${{ matrix.language == 'python' && env.PUBLISH_PYPI == 'true' }}
        run: |
          if curl -fsSL "https://pypi.org/pypi/pulumi-bytepluscc/${{ steps.version.outputs.version }}/json" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ matrix.language == 'python' && env.PUBLISH_PYPI == 'true' && steps.pypi_package.outputs.exists != 'true' }}
        name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ env.PYPI_USERNAME }}
          password: ${{ env.PYPI_PASSWORD }}
          packages-dir: ${{ github.workspace }}/sdk/python/bin/dist
          skip-existing: true
      - name: Check npm package
        id: npm_package
        if: ${{ matrix.language == 'nodejs' && env.PUBLISH_NPM == 'true' }}
        run: |
          package_name="$(node -p "require('./sdk/nodejs/bin/package.json').name")"
          package_version="$(node -p "require('./sdk/nodejs/bin/package.json').version")"
          if npm view "${package_name}@${package_version}" version --registry "${NPM_REGISTRY_URL}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ matrix.language == 'nodejs' && env.PUBLISH_NPM == 'true' && steps.npm_package.outputs.exists != 'true' }}
        uses: JS-DevTools/npm-publish@v1
        with:
          access: "public"
          token: ${{ env.NPM_TOKEN }}
          package: ${{ github.workspace }}/sdk/nodejs/bin/package.json
      - if: ${{ matrix.language == 'dotnet' && env.PUBLISH_NUGET == 'true' }}
        name: publish nuget package
        run: |
          dotnet nuget push ${{ github.workspace }}/sdk/dotnet/bin/Debug/*.nupkg -s ${{ env.NUGET_FEED_URL }} -k ${{ env.NUGET_PUBLISH_KEY }} --skip-duplicate
          echo "done publishing packages"
      - name: Check Go SDK tag
        id: go_sdk
        if: ${{ matrix.language == 'go' && env.PUBLISH_GO == 'true' }}
        run: |
          tag="sdk/v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ matrix.language == 'go' && env.PUBLISH_GO == 'true' && steps.go_sdk.outputs.exists != 'true' }}
        uses: pulumi/publish-go-sdk-action@v1
        with:
          repository: ${{ github.repository }}
          base-ref: ${{ github.sha }}
          source: sdk
          path: sdk
          version: ${{ steps.version.outputs.version }}
          additive: false
      - name: Check Java package
        id: java_package
        if: ${{ matrix.language == 'java' && env.PUBLISH_JAVA == 'true' }}
        run: |
          version="${{ steps.version.outputs.version }}"
          artifact="https://repo1.maven.org/maven2/com/byteplus/bytepluscc/${version}/bytepluscc-${version}.pom"
          if curl -fsSL "${artifact}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ matrix.language == 'java' && env.PUBLISH_JAVA == 'true' && steps.java_package.outputs.exists != 'true' }}
        uses: gradle/gradle-build-action@9b814496b50909128c6a52622b416c5ffa04db49
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        with:
          arguments: publishToSonatype closeAndReleaseSonatypeStagingRepository
          build-root-directory: ./sdk/java
          gradle-version: ${{ matrix.gradleversion }}
    strategy:
      fail-fast: true
      matrix:
        dotnetversion:
          - 6.0.408
        language:
          - nodejs
          - python
          - dotnet
          - go
          - java
        nodeversion:
          - 23.x
        pythonversion:
          - "3.9"
        gradleversion:
          - "7.4.1"
